# GibCord 6.0 na Windows — budowanie na prawdziwym Windowsie.
#  • każdy push na main: testy, aplikacja, zrzuty ekranu z trybu pokazowego, instalator (artefakty, bez wydania)
#  • tag v6.X.Y-beta.N: to samo + wydanie na GitHubie (Velopack: Setup.exe i automatyczne aktualizacje)
name: Budowanie

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: budowanie-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  VPK_VERSION: '1.2.161'
  LIVEKIT_VERSION: '1.13.11'

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Wersja
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.Substring(1) }
          else { $v = "6.0.0-ci.$($env:GITHUB_RUN_NUMBER)" }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Wersja: $v"

      # LiveKit w tym samym kroku co testy — Windows zamyka procesy uruchomione w kroku po jego końcu
      - name: Testy rdzenia (z głosem przez lokalny LiveKit)
        timeout-minutes: 12
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/livekit/livekit/releases/download/v$env:LIVEKIT_VERSION/livekit_$($env:LIVEKIT_VERSION)_windows_amd64.zip" -OutFile lk.zip
          Expand-Archive lk.zip -DestinationPath lk
          $exe = Get-ChildItem lk -Recurse -Filter livekit-server.exe | Select-Object -First 1
          $lk = Start-Process -FilePath $exe.FullName -ArgumentList '--dev','--bind','127.0.0.1' -RedirectStandardOutput lk-out.txt -RedirectStandardError lk-err.txt -PassThru
          for ($i = 0; $i -lt 30; $i++) { try { Invoke-WebRequest http://127.0.0.1:7880 -UseBasicParsing -TimeoutSec 2 | Out-Null; break } catch { Start-Sleep 1 } }
          dotnet test tests/GibCord.Core.Tests -c Release --logger "console;verbosity=normal"
          $code = $LASTEXITCODE
          if ($code -ne 0) { Write-Host '--- LiveKit ---'; Get-Content lk-err.txt -Tail 30 }
          Stop-Process -Id $lk.Id -Force -ErrorAction SilentlyContinue
          exit $code
        env:
          GC_LK_URL: ws://127.0.0.1:7880
          GC_LK_KEY: devkey
          GC_LK_SECRET: secret

      - name: Aplikacja (publikacja)
        run: dotnet publish src/GibCord.App -c Release -r win-x64 -p:Platform=x64 --self-contained -o publish -p:Version=${{ steps.ver.outputs.version }} -p:PublishReadyToRun=true

      - name: Rozmiar
        shell: pwsh
        run: |
          $s = (Get-ChildItem publish -Recurse | Measure-Object Length -Sum).Sum
          Write-Host ("Aplikacja: {0:N1} MB, plików: {1}" -f ($s / 1MB), (Get-ChildItem publish -Recurse -File).Count)
          Get-ChildItem publish -Recurse -File | Sort-Object Length -Descending | Select-Object -First 30 | ForEach-Object { "{0,8:N1} MB  {1}" -f ($_.Length / 1MB), $_.FullName.Substring((Resolve-Path publish).Path.Length + 1) }

      - name: Zrzuty ekranu (tryb pokazowy)
        timeout-minutes: 8
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force zrzuty | Out-Null
          foreach ($v in 'chat','dm','friends','login','switcher','profile','voice','thread','emoji','search','dmcall') {
            $out = Join-Path $pwd "zrzuty\$v.png"
            $p = Start-Process -FilePath publish\GibCord.exe -ArgumentList '--demo','--view',$v,'--screenshot',"`"$out`"" -PassThru
            if (-not $p.WaitForExit(45000)) { $p.Kill(); Write-Host "::warning::Zrzut ${v} - przekroczony czas" }
            if (Test-Path $out) { Write-Host "OK $v" } else { Write-Host "::warning::Brak zrzutu ${v} (kod $($p.ExitCode))" }
          }
          Get-ChildItem zrzuty | Format-Table Name, Length
          $log = Join-Path $env:LOCALAPPDATA 'GibCord6-dane\dziennik.txt'
          if (Test-Path $log) { Copy-Item $log zrzuty\dziennik.txt; Get-Content $log -Tail 60 }
          Write-Host '--- pliki .pri i .exe ---'
          Get-ChildItem publish -File | Where-Object { $_.Extension -in '.pri','.exe','.winmd' } | Format-Table Name, Length
          Write-Host '--- dziennik zdarzeń Windows (błędy aplikacji) ---'
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-10) } -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -in 'Application Error','.NET Runtime','Windows Error Reporting' } | Select-Object -First 6 |
            ForEach-Object { Write-Host "[$($_.ProviderName)] $($_.Message)"; Write-Host '' }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zrzuty
          path: zrzuty
          retention-days: 7

      - name: Instalator (Velopack)
        shell: pwsh
        run: |
          dotnet tool install -g vpk --version $env:VPK_VERSION
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            # poprzednie wydanie → mniejsze aktualizacje (delta)
            vpk download github --repoUrl "https://github.com/$env:GITHUB_REPOSITORY" --token "$env:GH_TOKEN" --pre -o Releases
            if ($LASTEXITCODE -ne 0) { Write-Host 'Brak poprzedniego wydania'; $global:LASTEXITCODE = 0 }
          }
          vpk pack -u GibCord6 -v ${{ steps.ver.outputs.version }} -p publish -e GibCord.exe -o Releases `
            --packTitle "GibCord 6.0 beta" --packAuthors "GibCord" --icon src/GibCord.App/Assets/gibcord.ico --shortcuts Desktop,StartMenuRoot
          Get-ChildItem Releases | Format-Table Name, Length
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: GibCord-6-instalator
          path: Releases/*-Setup.exe
          retention-days: 14

      - name: Wydanie na GitHubie
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          vpk upload github --repoUrl "https://github.com/$env:GITHUB_REPOSITORY" --token "$env:GH_TOKEN" -o Releases `
            --publish --pre --releaseName "GibCord ${{ steps.ver.outputs.version }}" --tag "$env:GITHUB_REF_NAME" --merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Paczka MSIX do Microsoft Store (ta sama tożsamość co dotychczasowy GibCord w Partner Center).
  # Bez podpisu — Sklep podpisuje sam. Do sprawdzenia podpisujemy kopię certyfikatem testowym, instalujemy i robimy zrzut.
  sklep:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Wersja paczki
        id: ver
        shell: pwsh
        run: |
          # Sklep chce czterech liczb i rosnącej wersji: 6.0.0-beta.1 → 6.0.1.0, 6.0.0 → 6.0.99.0, 6.0.1-beta.2 → 6.0.102.0
          $v = '6.0.0.0'
          if ($env:GITHUB_REF -match '^refs/tags/v(\d+)\.(\d+)\.(\d+)(-beta\.(\d+))?$') {
            $patch = [int]$Matches[3] * 100 + ($(if ($Matches[5]) { [int]$Matches[5] } else { 99 }))
            $v = "$($Matches[1]).$($Matches[2]).$patch.0"
          }
          "msix=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Wersja paczki: $v"

      - name: Paczka MSIX
        shell: pwsh
        run: |
          Copy-Item store\Package.appxmanifest src\GibCord.App\Package.appxmanifest
          New-Item -ItemType Directory -Force src\GibCord.App\Images | Out-Null
          Copy-Item store\Images\* src\GibCord.App\Images\
          (Get-Content src\GibCord.App\Package.appxmanifest -Raw) -replace 'Version="6\.0\.0\.0"', 'Version="${{ steps.ver.outputs.msix }}"' | Set-Content src\GibCord.App\Package.appxmanifest -Encoding utf8
          dotnet publish src/GibCord.App -c Release -r win-x64 -p:Platform=x64 -p:WindowsPackageType=MSIX -p:GenerateAppxPackageOnBuild=true `
            -p:AppxPackageSigningEnabled=false -p:AppxBundle=Never -p:UapAppxPackageBuildMode=SideloadOnly -p:AppxPackageDir="$pwd\sklep\" `
            -p:AppxGeneratePriEnabled=true -p:ProjectPriFileName=resources.pri `
            -p:Version=${{ steps.ver.outputs.msix }} -p:PublishReadyToRun=true
          $msix = Get-ChildItem sklep -Recurse -Filter *.msix | Select-Object -First 1
          if (-not $msix) { throw 'Brak paczki .msix' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($msix.FullName)
          $pri = $zip.Entries | Where-Object { $_.FullName -like '*.pri' } | ForEach-Object { "$($_.FullName) ($($_.Length))" }
          $zip.Dispose()
          Write-Host "Pliki .pri w paczce: $($pri -join ', ')"
          if (-not ($pri -match '^resources\.pri')) { Write-Host '::error::W paczce nie ma resources.pri — WinUI nie znajdzie swoich zasobów' }
          Copy-Item $msix.FullName "GibCord-Sklep-${{ steps.ver.outputs.msix }}.msix"
          Write-Host ("Paczka: {0} ({1:N1} MB)" -f $msix.Name, ($msix.Length / 1MB))

      - name: Próba instalacji (certyfikat testowy) i zrzut
        timeout-minutes: 10
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type Custom -Subject 'CN=04559352-DF71-4AA3-A4CF-B55AA03F9922' -KeyUsage DigitalSignature -FriendlyName 'GibCord test' `
            -CertStoreLocation 'Cert:\CurrentUser\My' -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          Copy-Item "GibCord-Sklep-${{ steps.ver.outputs.msix }}.msix" test.msix
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /fd SHA256 /sha1 $cert.Thumbprint test.msix
          Export-Certificate -Cert $cert -FilePath test.cer | Out-Null
          Import-Certificate -FilePath test.cer -CertStoreLocation 'Cert:\LocalMachine\TrustedPeople' | Out-Null
          Add-AppxPackage -Path test.msix
          $pkg = Get-AppxPackage GibCord.GibCord
          Write-Host "Zainstalowano: $($pkg.PackageFullName)"
          New-Item -ItemType Directory -Force zrzuty-sklep | Out-Null
          $out = Join-Path $pwd 'zrzuty-sklep\chat.png'
          # alias z manifestu uruchamia aplikację z tożsamością paczki (tak jak ze Sklepu) i przekazuje argumenty
          $alias = Join-Path $env:LOCALAPPDATA 'Microsoft\WindowsApps\gibcord.exe'
          $p = Start-Process -FilePath $alias -ArgumentList '--demo','--view','voice','--screenshot',"`"$out`"" -PassThru
          for ($i = 0; $i -lt 60 -and -not (Test-Path $out); $i++) { Start-Sleep 1 }
          Start-Sleep 2
          Get-Process GibCord -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          if (Test-Path $out) { Write-Host 'Aplikacja z paczki uruchamia się' } else { Write-Host '::warning::Brak zrzutu z paczki' }
          $log = Get-ChildItem (Join-Path $env:LOCALAPPDATA "Packages\$($pkg.PackageFamilyName)") -Recurse -Filter dziennik.txt -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($log) { Copy-Item $log.FullName zrzuty-sklep\dziennik.txt; Get-Content $log.FullName -Tail 30 }
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-5) } -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -in 'Application Error','.NET Runtime' } | Select-Object -First 3 | ForEach-Object { Write-Host "[$($_.ProviderName)] $($_.Message)" }

      - uses: actions/upload-artifact@v4
        with:
          name: GibCord-Sklep-msix
          path: |
            GibCord-Sklep-*.msix
            zrzuty-sklep
          retention-days: 30

